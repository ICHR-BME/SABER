# Preregistered analysis plan (DRAFT). Freeze with: uv run python scripts/freeze_prereg.py --freeze
# Items under `open_items` must be resolved (and this file edited) BEFORE freezing.
version: 1
status: draft
source: docs/PROPUESTA.md v2 (2.1, 2.3, Appendix C, Appendix D)
alpha: 0.05
multiplicity: holm            # over the preregistered confirmatory comparisons below
ci: {proportions: wilson, auroc_aurc: scene_cluster_bootstrap, n_boot: 10000}

metrics:                       # Appendix C, implemented in saber/eval/metrics.py
  - SR
  - WOR
  - FCR
  - AR
  - coverage
  - risk                       # WOR among executed
  - AURC
  - AUROC                      # gate score as discriminator of wrong vs correct decisions
  - latency_per_decision_s
  - robot_hours

gates_schedule:                # PROPUESTA 2.4
  G0: {test: "SR(S0,E0) >= 0.50 and SR(S0,E0) - SR(S0,NOINSTR) >= 0.20", data: real}
  G1: {test: "raw Spanish and Spanglish near chance and below English, p < 0.01", data: odpb, min_decisions: 300}
  G2: {test: "IMG AUROC > every baseline in 2 of 3 shifts", data: odpb}
  G3: {test: "real-robot confirmation S1 vs S2 (reduced)", data: real}

confirmatory:
  H1:
    system: S0
    conditions: [S2, S3, V2]
    tests:
      - name: below_english
        test: mcnemar_exact          # paired S0-E0 vs S0-<cond> on matched scenes
        outcome: target_accuracy
        direction: E0 > cond
      - name: near_no_instruction
        test: binomial_exact         # Appendix D: binomial vs no-instruction
        outcome: target_accuracy
        criterion: "upper 95% Wilson bound of acc(cond) <= acc(NOINSTR) + 0.15"
    supported_if: "both tests pass for the condition (Holm-adjusted)"
  H2:
    system: S1
    tests:
      - name: recovery_formal_spanish
        statistic: "SR(S1, formal Spanish) / SR(S1, E0)"
        ci: scene_cluster_bootstrap
        criterion: ">= 0.80"
      - name: residual_wor
        statistic: "WOR(S1, S3 or V1/V2)"
        ci: wilson
        criterion: ">= 0.10 in Spanglish or voice"
  H3:
    data: odpb                       # calibrated offline, then checked in closed loop
    shifts: [S2, S3, V2]
    statistic: "AUROC(IMG) - max_b AUROC(baseline b)"
    baselines: [G-text, G-conf, G-ood, G-act, G-int]
    ci: scene_cluster_bootstrap
    criterion: ">= 0.03 and 95% CI excludes 0, in >= 2 of 3 shifts"
  H4:
    coverage: 0.80
    test: mcnemar_exact              # paired decisions IMG vs S1 at matched coverage
    criterion: "relative WOR reduction >= 0.50"
  H5:
    type: exploratory
    systems: [S4, S1]
    conditions: [E0, S2]
    report: [SR, latency_per_decision_s, robot_hours]

calibration:                   # saber/gate/calibrate.py
  method: ltt                  # selective risk, P(risk <= alpha_gate) >= 1 - delta
  alpha_gate: 0.10
  delta: 0.10
  split: by_scene
  report_per_condition_violations: true

trials:                        # PROPUESTA 2.3.3; generated by scripts/make_trials.py
  pairs_per_cell: 40
  reduced_cells_A1_O1: 20
  total: 800
  randomization: blocks_of_all_cells_paired_scenes
  priority_if_short_of_robot_time: [S0, S1, S2, S4, S3]

open_items:                    # resolve before freezing (see docs/DECISIONS.md)
  - "Power: 40 pairs give 0.70-0.99 power for 30 points depending on dependence (D7). Decide n per key cell."
  - "V2 SNR levels: generator default 10 dB and 0 dB is a proposal, not in PROPUESTA."
  - "H2 needs formal Spanish (condition S1) but S1 real trials list E0, S2, S3, V1, V2: add an S1-condition cell or evaluate H2-recovery on the ODPB."
  - "H1 'within 15 points' operationalized as an upper Wilson bound; confirm with the advisor."
  - "H3 on V2 needs ASR transcripts of recorded noisy speech in the ODPB."
  - "Real trials randomize targets over all five zones; confirm."
