# LIBERO-Goal instructions and translations.
#
# English source = LIBERO's `task.language`, which LIBERO derives from the BDDL *file name*
# (benchmark/__init__.py: grab_language_from_filename) and which LeRobot passes to the policy as
# `task_description`. NOTE: it differs from the `(:language ...)` line inside each BDDL file
# (e.g. "Open the middle layer of the drawer"); we translate what the policy actually receives.
# Source: github.com/Lifelong-Robot-Learning/LIBERO @ 8f1084e3132a (libero_suite_task_map.py).
#
# Translations: LLM drafts (claude-opus-5-5, 2026-11-03). ALL PENDING human review by native
# speakers. es = Mexican Spanish.
status: llm_draft_needs_review
languages: [es, pt, fr, de]
tasks:
