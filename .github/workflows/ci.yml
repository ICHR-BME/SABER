name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # CPU only: MockXArm + synthetic data. No GPU, no robot, no heavy extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
